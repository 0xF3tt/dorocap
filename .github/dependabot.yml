version: 2

# Monthly, with one grouped pull request per ecosystem (majors included) and
# one grouped pull request for security fixes. main requires up-to-date
# branches, so every extra pull request means another rebase after each merge.
# Scanner versions pinned in the Makefile are bumped by hand (see Makefile).
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "09:00"
      timezone: "America/Monterrey"
    # Skip versions younger than a week: most hijacked releases are caught by then.
    # Security updates ignore cooldown.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps(actions)"
    groups:
      actions:
        patterns: ["*"]
      actions-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "09:20"
      timezone: "America/Monterrey"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps(go)"
    groups:
      go:
        patterns: ["*"]
      go-security:
        applies-to: security-updates
        patterns: ["*"]
